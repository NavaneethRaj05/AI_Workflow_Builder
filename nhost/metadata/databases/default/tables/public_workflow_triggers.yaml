table:
  name: workflow_triggers
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - trigger_type
        - config
        - webhook_secret
        - is_active
      check:
        _or:
          # owner can add ANY trigger type
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # editor CANNOT add webhook
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - trigger_type:
                  _in:
                    - manual
                    - scheduled
      set:
        created_by: X-Hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns:
        - trigger_type
        - config
        - webhook_secret
        - is_active
      filter:
        _or:
          # Owner can update any trigger
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # Editors can only update manual or scheduled triggers
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - trigger_type:
                  _in:
                    - manual
                    - scheduled
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          # Owner can delete any trigger
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # Editors can only delete manual or scheduled triggers
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - trigger_type:
                  _in:
                    - manual
                    - scheduled
