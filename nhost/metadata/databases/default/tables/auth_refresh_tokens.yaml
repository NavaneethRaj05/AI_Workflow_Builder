table:
  name: refresh_tokens
  schema: auth
configuration:
  custom_name: refreshTokens
  custom_column_names:
    created_at: createdAt
    expires_at: expiresAt
    refresh_token: refreshToken
    updated_at: updatedAt
    user_id: userId
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: "*"
      filter: {}
