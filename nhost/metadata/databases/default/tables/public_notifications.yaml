table:
  name: notifications
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
  - role: editor
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
