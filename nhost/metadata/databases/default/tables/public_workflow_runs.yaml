table:
  name: workflow_runs
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: triggered_by_user
    using:
      foreign_key_constraint_on: triggered_by

array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        table:
          name: step_runs
          schema: public
        column: workflow_run_id

computed_fields:
  - name: total_steps
    definition:
      function:
        name: workflow_run_step_count
        schema: public
  - name: completed_steps
    definition:
      function:
        name: workflow_run_completed_steps
        schema: public

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
  - role: editor
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
