table:
  name: users
  schema: auth
configuration:
  custom_name: users
  custom_root_fields:
    select: users
    select_by_pk: user
    select_aggregate: usersAggregate
  custom_column_names:
    avatar_url: avatarUrl
    created_at: createdAt
    default_role: defaultRole
    display_name: displayName
    email: email
    email_verified: emailVerified
    id: id
    is_anonymous: isAnonymous
    last_seen: lastSeen
    locale: locale
    updated_at: updatedAt
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - email_verified
        - is_anonymous
        - display_name
        - avatar_url
        - created_at
        - updated_at
      filter: {}
