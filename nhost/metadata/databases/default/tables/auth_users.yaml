table:
  name: users
  schema: auth
configuration:
  custom_name: users
  custom_column_names:
    active_mfa_type: activeMfaType
    avatar_url: avatarUrl
    created_at: createdAt
    default_role: defaultRole
    disabled: disabled
    display_name: displayName
    email: email
    email_verified: emailVerified
    id: id
    is_anonymous: isAnonymous
    last_seen: lastSeen
    locale: locale
    metadata: metadata
    new_email: newEmail
    otp_hash: otpHash
    otp_hash_expires_at: otpHashExpiresAt
    otp_method_last_used: otpMethodLastUsed
    password_hash: passwordHash
    phone_number: phoneNumber
    phone_number_verified: phoneNumberVerified
    ticket: ticket
    ticket_expires_at: ticketExpiresAt
    totp_secret: totpSecret
    updated_at: updatedAt
    webauthn_current_challenge: webauthnCurrentChallenge
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        table:
          name: org_members
          schema: public
        column: user_id

select_permissions:
  - role: user
    permission:
      columns:
        - active_mfa_type
        - avatar_url
        - created_at
        - default_role
        - disabled
        - display_name
        - email
        - email_verified
        - id
        - is_anonymous
        - last_seen
        - locale
        - metadata
        - new_email
        - otp_hash_expires_at
        - otp_method_last_used
        - phone_number
        - phone_number_verified
        - ticket_expires_at
        - updated_at
      filter: {}
