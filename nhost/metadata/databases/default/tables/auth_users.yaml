table:
  name: users
  schema: auth
configuration:
  custom_name: users
  custom_column_names:
    display_name: displayName
    avatar_url: avatarUrl
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        table:
          name: org_members
          schema: public
        column: user_id

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - display_name
        - avatar_url
      filter: {}
