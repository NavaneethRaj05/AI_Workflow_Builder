table:
  name: users
  schema: auth
configuration:
  custom_name: users
  custom_root_fields:
    select: users
    select_by_pk: user
    select_aggregate: usersAggregate
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - email
        - display_name
        - avatar_url
        - created_at
        - updated_at
      filter: {}
