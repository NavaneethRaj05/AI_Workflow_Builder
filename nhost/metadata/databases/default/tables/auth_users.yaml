table:
  name: users
  schema: auth
configuration:
  custom_name: users
  custom_root_fields:
    delete: deleteUsers
    delete_by_pk: deleteUser
    insert: insertUsers
    insert_one: insertUser
    select: users
    select_aggregate: usersAggregate
    select_by_pk: user
    update: updateUsers
    update_by_pk: updateUser
  custom_column_names:
    avatar_url: avatarUrl
    created_at: createdAt
    default_role: defaultRole
    disabled: disabled
    display_name: displayName
    email: email
    email_verified: emailVerified
    id: id
    is_anonymous: isAnonymous
    last_seen: lastSeen
    locale: locale
    metadata: metadata
    new_email: newEmail
    password_hash: passwordHash
    phone_number: phoneNumber
    phone_number_verified: phoneNumberVerified
    ticket: ticket
    ticket_expires_at: ticketExpiresAt
    updated_at: updatedAt
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        table:
          name: org_members
          schema: public
        column: user_id
  - name: roles
    using:
      foreign_key_constraint_on:
        table:
          name: user_roles
          schema: auth
        column: user_id
  - name: userProviders
    using:
      foreign_key_constraint_on:
        table:
          name: user_providers
          schema: auth
        column: user_id
  - name: refreshTokens
    using:
      foreign_key_constraint_on:
        table:
          name: refresh_tokens
          schema: auth
        column: user_id

select_permissions:
  - role: user
    permission:
      columns:
        - avatar_url
        - created_at
        - default_role
        - display_name
        - email
        - id
        - last_seen
        - locale
        - updated_at
      filter: {}
