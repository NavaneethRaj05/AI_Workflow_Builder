table:
  name: step_runs
  schema: public

object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: approved_by_user
    using:
      foreign_key_constraint_on: approved_by

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        workflow_run:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
