table:
  name: step_runs
  schema: public

object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: approved_by_user
    using:
      foreign_key_constraint_on: approved_by

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow_run:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow_run:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow_run:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  user_id: { _eq: X-Hasura-User-Id }
