table:
  name: step_runs
  schema: public

object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: approved_by_user
    using:
      foreign_key_constraint_on: approved_by

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        workflow_run:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error
        - attempt_count
      check:
        workflow_run:
          organization:
            org_members:
              _and:
                - user_id: { _eq: X-Hasura-User-Id }
                - role: { _in: [owner, editor] }

update_permissions:
  - role: user
    permission:
      columns:
        - status
        - output
        - error
        - attempt_count
        - completed_at
        - approved_by
        - approved_at
        - approval_comment
      filter:
        workflow_run:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
      check: {}

