table:
  name: workflows
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_steps
          schema: public
        column: workflow_id
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_triggers
          schema: public
        column: workflow_id
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_runs
          schema: public
        column: workflow_id

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
  - role: editor
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: owner
    permission:
      columns:
        - name
        - description
        - org_id
        - is_active
      check:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
      set:
        created_by: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - name
        - description
        - org_id
        - is_active
      check:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
      set:
        created_by: X-Hasura-User-Id

update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
      check: {}
  - role: editor
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
      check: {}

delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
