table:
  name: workflows
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_steps
          schema: public
        column: workflow_id
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_triggers
          schema: public
        column: workflow_id
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_runs
          schema: public
        column: workflow_id

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - org_id
        - is_active
      check:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      set:
        created_by: X-Hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
