table:
  name: organizations
  schema: public

array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        table:
          name: org_members
          schema: public
        column: org_id
  - name: workflows
    using:
      foreign_key_constraint_on:
        table:
          name: workflows
          schema: public
        column: org_id
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_runs
          schema: public
        column: org_id
  - name: notifications
    using:
      foreign_key_constraint_on:
        table:
          name: notifications
          schema: public
        column: org_id

computed_fields:
  - name: quota_remaining
    definition:
      function:
        name: get_org_quota_remaining
        schema: public
    comment: "Remaining quota = quota_limit - quota_used"

select_permissions:
  - role: user
    permission:
      columns: "*"
      computed_fields:
        - quota_remaining
      filter:
        org_members:
          user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_reset_at

update_permissions:
  - role: user
    permission:
      columns:
        - name
        - slug
        - quota_limit
      filter:
        org_members:
          _and:
            - user_id: { _eq: X-Hasura-User-Id }
            - role: { _eq: owner }
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        org_members:
          _and:
            - user_id: { _eq: X-Hasura-User-Id }
            - role: { _eq: owner }
