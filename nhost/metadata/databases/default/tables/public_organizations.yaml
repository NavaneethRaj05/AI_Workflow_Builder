table:
  name: organizations
  schema: public

array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        table:
          name: org_members
          schema: public
        column: org_id
  - name: workflows
    using:
      foreign_key_constraint_on:
        table:
          name: workflows
          schema: public
        column: org_id
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        table:
          name: workflow_runs
          schema: public
        column: org_id
  - name: notifications
    using:
      foreign_key_constraint_on:
        table:
          name: notifications
          schema: public
        column: org_id

computed_fields:
  - name: quota_remaining
    definition:
      function:
        name: get_org_quota_remaining
        schema: public
    comment: "Remaining quota = quota_limit - quota_used"

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
  - role: editor
    permission:
      columns:
        - id
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_reset_at
        - created_at
        - updated_at
      filter:
        id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns:
        - id
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_reset_at
        - created_at
        - updated_at
      filter:
        id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }

update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - slug
        - quota_limit
      filter:
        id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
      check: {}
