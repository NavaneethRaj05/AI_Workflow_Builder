table:
  name: workflow_steps
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        table:
          name: step_runs
          schema: public
        column: workflow_step_id

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        workflow:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - name
        - step_order
        - step_type
        - config
        - is_enabled
      check:
        _or:
          # owner can add ANY step type
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # editor CANNOT add db_write, notify
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - step_type:
                  _in:
                    - llm_call
                    - http_request
                    - conditional_branch
                    - approval_gate
      set:
        created_by: X-Hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns:
        - name
        - step_order
        - step_type
        - config
        - is_enabled
      filter:
        _or:
          # Owner can update any step
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # Editors can only update non-restricted step types
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - step_type:
                  _in:
                    - llm_call
                    - http_request
                    - conditional_branch
                    - approval_gate
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          # Owner can delete any step
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
          # Editors can only delete non-restricted step types
          - _and:
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id: { _eq: X-Hasura-User-Id }
                        - role: { _eq: editor }
              - step_type:
                  _in:
                    - llm_call
                    - http_request
                    - conditional_branch
                    - approval_gate
