table:
  name: workflow_steps
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by

array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        table:
          name: step_runs
          schema: public
        column: workflow_step_id

select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  user_id: { _eq: X-Hasura-User-Id }
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: owner
    permission:
      columns:
        - workflow_id
        - name
        - step_order
        - step_type
        - config
        - is_enabled
      check:
        # owner can add ANY step type, including restricted ones
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
      set:
        created_by: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - workflow_id
        - name
        - step_order
        - step_type
        - config
        - is_enabled
      check:
        # editor CANNOT add db_write, notify, or webhook-trigger-adjacent steps
        # This is enforced by restricting to non-restricted step types
        _and:
          - workflow:
              org_id:
                _in:
                  $select:
                    table: org_members
                    columns: [org_id]
                    where:
                      user_id: { _eq: X-Hasura-User-Id }
          - step_type:
              _in:
                - llm_call
                - http_request
                - conditional_branch
                - approval_gate
      set:
        created_by: X-Hasura-User-Id

update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - step_order
        - step_type
        - config
        - is_enabled
      filter:
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
      check: {}
  - role: editor
    permission:
      columns:
        - name
        - step_order
        - config
        - is_enabled
      filter:
        _and:
          - workflow:
              org_id:
                _in:
                  $select:
                    table: org_members
                    columns: [org_id]
                    where:
                      user_id: { _eq: X-Hasura-User-Id }
          # Editors can only update non-restricted step types
          - step_type:
              _in:
                - llm_call
                - http_request
                - conditional_branch
                - approval_gate
      check: {}

delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          org_id:
            _in:
              $select:
                table: org_members
                columns: [org_id]
                where:
                  _and:
                    - user_id: { _eq: X-Hasura-User-Id }
                    - role: { _eq: owner }
  - role: editor
    permission:
      filter:
        _and:
          - workflow:
              org_id:
                _in:
                  $select:
                    table: org_members
                    columns: [org_id]
                    where:
                      user_id: { _eq: X-Hasura-User-Id }
          - step_type:
              _in:
                - llm_call
                - http_request
                - conditional_branch
                - approval_gate
