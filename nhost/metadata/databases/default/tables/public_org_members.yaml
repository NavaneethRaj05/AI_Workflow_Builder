table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        _or:
          # Case 1: User is already an owner of this org (can add other members)
          - organization:
              org_members:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
          # Case 2: Bootstrap — user is adding THEMSELVES (user_id matches caller)
          # This handles the first-member case after org creation
          - user_id: { _eq: X-Hasura-User-Id }

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - organization:
              org_members:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
          # Cannot delete yourself
          - user_id: { _ne: X-Hasura-User-Id }
