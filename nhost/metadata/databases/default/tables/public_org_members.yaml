table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id

select_permissions:
  - role: user
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                user_id: { _eq: X-Hasura-User-Id }

insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        org_id:
          _in:
            $select:
              table: org_members
              columns: [org_id]
              where:
                _and:
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _eq: owner }
      check: {}

delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - org_id:
              _in:
                $select:
                  table: org_members
                  columns: [org_id]
                  where:
                    _and:
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
          # Cannot delete yourself
          - user_id: { _ne: X-Hasura-User-Id }
